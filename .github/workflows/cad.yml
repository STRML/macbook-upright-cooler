name: CAD validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  meshes:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install CAD and validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad
          python -m pip install -r tools/requirements.txt
          openscad --version
      - name: Test validator
        run: python -m unittest discover -s tests -v
      - name: Rebuild and check V1 and V2
        run: |
          make -j2 stl stl-v2
          make check-v2
          python tools/check_mesh.py build/upright_macbook_140mm_pressure_dock_v1.stl
      - name: Check published STL snapshot
        run: python tools/check_mesh.py cad/upright_v2/stl/*.stl
      - name: Check lean endpoints
        run: |
          for angle in 8 12; do
            openscad --hardwarnings -D 'PART="cradle"' -D "LEAN_DEG=$angle" -o "build/cradle-$angle.stl" cad/upright_v2/upright_macbook_140mm_pressure_dock_v2.scad
            python tools/check_mesh.py "build/cradle-$angle.stl"
          done
